[project]
name = "aeiou-arena"
version = "0.1.0"
description = "Evidence-led Claude negotiation agent, workbench, and evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arena-kit[sim,anthropic]",
  "anthropic>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "pydantic>=2.10",
  "openai>=2.0",
]

[project.scripts]
aeiou = "aeiou.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
arena-kit = { path = "vendor/arena-kit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeiou"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/arena-kit/tests"]
